<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>{{ title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

<h2 class="mb-4">Licenças</h2>

<table class="table table-bordered table-striped">

<thead class="table-dark">
<tr>
<th>Empresa</th>
<th>Máquina</th>
<th>Chave</th>
<th>Dias</th>
<th>Status</th>
<th>Valor Mensal</th>
</tr>
</thead>

<tbody>

{% for l in licencas %}

<tr>
<td>{{ l[1] }}</td>
<td>{{ l[2] }}</td>
<td>{{ l[3] }}</td>
<td>{{ l[4] }}</td>
<td>{{ l[5] }}</td>
<td>{{ l[6] if l[6] else 0 }} MZN</td>
</tr>

{% endfor %}

</tbody>

</table>

<a href="{{ url_for('painel') }}" class="btn btn-dark">
Voltar
</a>

</div>

</body>
</html>
