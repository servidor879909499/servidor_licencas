<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>{{ title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

<h2 class="mb-4">Clientes</h2>

<table class="table table-bordered table-striped">

<thead class="table-dark">
<tr>
<th>ID</th>
<th>Empresa</th>
<th>Máquina</th>
<th>Email</th>
<th>Status</th>
</tr>
</thead>

<tbody>

{% for c in clientes %}

<tr>
<td>{{ c[0] }}</td>
<td>{{ c[1] }}</td>
<td>{{ c[2] }}</td>
<td>{{ c[3] }}</td>
<td>{{ c[4] }}</td>
</tr>

{% endfor %}

</tbody>

</table>

<a href="{{ url_for('painel') }}" class="btn btn-dark">
Voltar
</a>

</div>

</body>
</html>
